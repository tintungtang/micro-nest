services:
    product-postgres:
        image: postgres:16-alpine
        container_name: mc-nest-product-db-container
        ports:
            - 5432:5432
        environment:
            POSTGRES_USER: product
            POSTGRES_PASSWORD: change-me
            POSTGRES_DB: mc_nest_products
        volumes:
            - postgres-data:/var/lib/postgresql/data

volumes:
    postgres-data:
