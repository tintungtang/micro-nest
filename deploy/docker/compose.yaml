name: micro-nest

services:
  api-gateway:
    image: ${API_GATEWAY_IMAGE:-api-gateway:latest}
    ports:
      - "${API_GATEWAY_HTTP_PORT:-8080}:3000"
    environment:
      PORT: 3000
      AUTH_SERVICE_HOST: auth
      AUTH_SERVICE_PORT: 3001
      PRODUCT_SERVICE_HOST: product
      PRODUCT_SERVICE_PORT: 3002
      FILE_STORAGE_SERVICE_HOST: file-storage
      FILE_STORAGE_SERVICE_PORT: 3003
    depends_on:
      - auth
      - product
      - file-storage

  auth:
    image: ${AUTH_IMAGE:-auth:latest}
    ports:
      - "${AUTH_HTTP_PORT:-8081}:3000"
    environment:
      PORT: 3000
      AUTH_SERVICE_PORT: 3001

  product:
    image: ${PRODUCT_IMAGE:-product:latest}
    ports:
      - "${PRODUCT_HTTP_PORT:-8082}:3000"
    environment:
      PORT: 3000
      PRODUCT_SERVICE_PORT: 3002
      DATABASE_URL: postgresql://${POSTGRES_USER:-product}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-mc_nest_products}?schema=public
    depends_on:
      - postgres

  file-storage:
    image: ${FILE_STORAGE_IMAGE:-file-storage:latest}
    ports:
      - "${FILE_STORAGE_HTTP_PORT:-8083}:3000"
    environment:
      PORT: 3000
      FILE_STORAGE_SERVICE_PORT: 3003
      FILE_STORAGE_ROOT: ${FILE_STORAGE_ROOT:-/app/data}
    volumes:
      - file-storage-data:${FILE_STORAGE_ROOT:-/app/data}

  postgres:
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-product}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-mc_nest_products}
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  file-storage-data:
  postgres-data:
