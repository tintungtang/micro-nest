apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: micro-nest

resources:
  - namespace.yaml
  - configmap.yaml
  - secrets.yaml
  - postgres.yaml
  - api-gateway.yaml
  - auth.yaml
  - product.yaml
  - file-storage.yaml

images:
  - name: api-gateway
    newName: api-gateway
    newTag: latest
  - name: auth
    newName: auth
    newTag: latest
  - name: product
    newName: product
    newTag: latest
  - name: file-storage
    newName: file-storage
    newTag: latest

labels:
  - pairs:
      app.kubernetes.io/part-of: micro-nest
    includeSelectors: true
