apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: file-storage-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-storage
  labels:
    app.kubernetes.io/name: file-storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: file-storage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: file-storage
    spec:
      containers:
        - name: file-storage
          image: file-storage:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
            - name: tcp
              containerPort: 3003
          env:
            - name: PORT
              value: "3000"
            - name: FILE_STORAGE_SERVICE_PORT
              valueFrom:
                configMapKeyRef:
                  name: micro-nest-config
                  key: FILE_STORAGE_SERVICE_PORT
            - name: FILE_STORAGE_ROOT
              valueFrom:
                configMapKeyRef:
                  name: micro-nest-config
                  key: FILE_STORAGE_ROOT
          volumeMounts:
            - name: file-storage-data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /api
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: file-storage-data
          persistentVolumeClaim:
            claimName: file-storage-data
---
apiVersion: v1
kind: Service
metadata:
  name: file-storage
  labels:
    app.kubernetes.io/name: file-storage
spec:
  selector:
    app.kubernetes.io/name: file-storage
  ports:
    - name: http
      port: 3000
      targetPort: http
    - name: tcp
      port: 3003
      targetPort: tcp
