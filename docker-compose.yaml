services:
  api-gateway:
    image: "api-gateway:latest"
    ports:
      - "8080:3000"
    environment:
      AUTH_SERVICE_HOST: auth
      AUTH_SERVICE_PORT: 3001
      PRODUCT_SERVICE_HOST: product
      PRODUCT_SERVICE_PORT: 3002
      FILE_STORAGE_SERVICE_HOST: file-storage
      FILE_STORAGE_SERVICE_PORT: 3003
    depends_on:
      - auth
      - product
      - file-storage

  auth:
    image: "auth:latest"
    environment:
      AUTH_SERVICE_PORT: 3001
    ports:
      - "8081:3000"

  product:
    image: "product:latest"
    environment:
      PORT: 3000
      PRODUCT_SERVICE_PORT: 3002
      DB_CONNECTION_STRING: mongodb://mongo:27017/
      DB_ADMIN_USER: admin
      DB_ADMIN_PASSWORD: admin
      DB_NAME: mc-nest-products
    ports:
      - "8082:3000"
    depends_on:
      - mongo

  file-storage:
    image: "file-storage:latest"
    environment:
      PORT: 3000
      FILE_STORAGE_SERVICE_PORT: 3003
      FILE_STORAGE_ROOT: /app/data
    ports:
      - "8083:3000"
    volumes:
      - file-storage-data:/app/data

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  file-storage-data:
  mongo-data:
