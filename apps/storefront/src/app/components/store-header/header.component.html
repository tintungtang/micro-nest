<header>
    <div class="container-fluid">
        <div class="row py-3 border-bottom">

            <div class="col-sm-4 col-lg-2 text-center text-sm-start d-flex gap-3 justify-content-center justify-content-md-start">
                <div class="d-flex align-items-center my-3 my-sm-0">
                    <a routerLink="/pages/dashboard">
                        <img src="assets/images/logo.svg" alt="logo" class="img-fluid">
                    </a>
                </div>
                <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar"
                        aria-controls="offcanvasNavbar">
                    <svg width="24" height="24" viewBox="0 0 24 24"><use xlink:href="#menu"></use></svg>
                </button>
            </div>

            <div class="col-sm-6 offset-sm-2 offset-md-0 col-lg-4">
                <div class="search-bar row bg-light p-2 rounded-4">
                    <div class="col-11 col-md-11">
                        <form id="search-form" class="text-center" (submit)="$event.preventDefault(); search(searchInput.value)">
                            <input #searchInput type="text" class="form-control border-0 bg-transparent"
                                   placeholder="Search for more than 20,000 products">
                        </form>
                    </div>
                    <div class="col-1" role="button" (click)="search(searchInput.value)">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="currentColor" d="M21.71 20.29L18 16.61A9 9 0 1 0 16.61 18l3.68 3.68a1 1 0 0 0 1.42 0a1 1 0 0 0 0-1.39ZM11 18a7 7 0 1 1 7-7a7 7 0 0 1-7 7Z"/></svg>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <ul class="navbar-nav list-unstyled d-flex flex-row gap-3 gap-lg-4 justify-content-center flex-wrap align-items-center mb-0 fw-bold text-uppercase text-dark">
                    <li class="nav-item" routerLinkActive="active">
                        <a routerLink="/pages/dashboard" class="nav-link">Home</a>
                    </li>
                    <li class="nav-item" routerLinkActive="active">
                        <a routerLink="/pages/products" class="nav-link">Products</a>
                    </li>
                    <li class="nav-item" routerLinkActive="active">
                        <a routerLink="/orders" class="nav-link">Orders</a>
                    </li>
                    <li class="nav-item" routerLinkActive="active">
                        <a routerLink="/cart" class="nav-link">Cart</a>
                    </li>
                    <li class="nav-item" routerLinkActive="active">
                        <a routerLink="/account" class="nav-link">Account</a>
                    </li>
                </ul>
            </div>

            <div class="col-sm-8 col-lg-2 d-flex gap-3 align-items-center justify-content-center justify-content-sm-end">
                <ul class="d-flex justify-content-end align-items-center list-unstyled m-0">
                    <li *ngIf="auth.profile() as profile; else signInLink" class="d-flex align-items-center gap-2">
                        <a routerLink="/account" class="p-2 mx-1 text-decoration-none" title="My account">
                            <svg width="24" height="24"><use xlink:href="#user"></use></svg>
                            <small class="fw-semibold">{{ profile.fullName || profile.username }}</small>
                        </a>
                        <a role="button" class="p-1 small text-decoration-underline" (click)="signOut()">Sign out</a>
                    </li>
                    <ng-template #signInLink>
                        <li>
                            <a routerLink="/auth/login" class="p-2 mx-1 text-decoration-none" title="Sign in">
                                <svg width="24" height="24"><use xlink:href="#user"></use></svg>
                                <small class="fw-semibold">Sign in</small>
                            </a>
                        </li>
                    </ng-template>
                    <li>
                        <ng-container *ngIf="orderButton" [ngComponentOutlet]="orderButton"></ng-container>
                    </li>
                    <li>
                        <mfe-cart-button *ngIf="cartButtonReady"></mfe-cart-button>
                    </li>
                </ul>
            </div>

        </div>
    </div>
</header>
